        ? De buitenunit laat de compressor niet draaien bij deze buitentemperatuur (Ta). Bij verwarmen gebeurt dit onder ongeveer -25°C en boven 46°C. De compressor start weer zodra Ta binnen het werkgebied valt.
        : Die Außeneinheit lässt den Kompressor bei dieser Außentemperatur (Ta) nicht laufen. Beim Heizen geschieht das unter etwa -25°C und über 46°C. Der Kompressor startet wieder, sobald Ta im Arbeitsbereich liegt.
        ? Toerental compressor wordt verlaagd. Als dezelfde storing binnen een bepaalde tijd drie keer optreedt, wordt de warmtepomp geblokkeerd en moet worden herstart.
        : Die Kompressordrehzahl wird gesenkt. Tritt dieselbe Störung innerhalb einer bestimmten Zeit dreimal auf, wird die Wärmepumpe gesperrt und muss neu gestartet werden.
