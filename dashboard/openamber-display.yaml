    template: oa_screen
    variables:
      tab: home
    custom_fields:
      body: |-
        [[[
        return variables.oa.TR((() => {

        const num = (e, d = 1) => { const s = states[e]; const v = s ? parseFloat(s.state) : NaN; return isNaN(v) ? '-' : v.toFixed(d); };
        const val = (e) => { const s = states[e]; const v = s ? parseFloat(s.state) : NaN; return isNaN(v) ? NaN : v; };
        const on = (e) => !!states[e] && states[e].state === 'on';
