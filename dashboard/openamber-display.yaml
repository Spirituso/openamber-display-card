        De eerste keer wordt de normale werking van de warmtepomp na 5 minuten automatisch hervat.: The first time, normal heat pump operation resumes automatically after 5 minutes.
        ? De eerste keer wordt de normale werking van de warmtepomp na 5 minuten automatisch hervat. Als dezelfde storing binnen een bepaalde tijd drie keer optreedt, wordt de warmtepomp geblokkeerd en moet worden herstart.
        : The first time, normal heat pump operation resumes automatically after 5 minutes. If the same fault occurs three times within a certain period, the heat pump is blocked and must be restarted.
        De warmtepomp is geblokkeerd door een storing in de compressorstart.: The heat pump is blocked by a compressor start fault.
        Als de persdruk meer dan 32 bar bedraagt wordt de compressor uitgeschakeld.: The compressor is switched off when the discharge pressure exceeds 32 bar.
        De compressorfrequentie zal worden begrensd. De druk zal hierdoor zakken en een normale werking wordt voortgezet.: The compressor frequency is limited. The pressure drops and normal operation continues.
        ? De compressor wordt voorverwarmd om te kunnen starten. Het zal maximaal 30 minuten duren voordat de compressor op bedrijfstemperatuur is. Daarna zal deze storing vanzelf verdwijnen en zal de compressor starten.
        : The compressor is being preheated so it can start. It takes up to 30 minutes for the compressor to reach operating temperature. After that this warning clears by itself and the compressor starts.
        Storing sensor persgasdruk.: Discharge pressure sensor fault.
        Storing sensor verdamper/condensor buitendeel.: Outdoor evaporator/condenser sensor fault.
        Voedingsspanning te hoog of te laag.: Supply voltage too high or too low.
        ? De buitenunit laat de compressor niet draaien bij deze buitentemperatuur (Ta). Bij verwarmen gebeurt dit onder ongeveer -25°C en boven 46°C. De compressor start weer zodra Ta binnen het werkgebied valt.
        : The outdoor unit does not run the compressor at this outside temperature (Ta). When heating this happens below about -25°C and above 46°C. The compressor starts again once Ta is within the operating range.
        ? Toerental compressor wordt verlaagd. Als dezelfde storing binnen een bepaalde tijd drie keer optreedt, wordt de warmtepomp geblokkeerd en moet worden herstart.
        : The compressor speed is reduced. If the same fault occurs three times within a certain period, the heat pump is blocked and must be restarted.
        Storing buitentemperatuursensor.: Outside temperature sensor fault.
        Storing persgas temp sensor.: Discharge gas temperature sensor fault.
        Storing zuiggas temp sensor.: Suction gas temperature sensor fault.
        Storing zuiggas druk sensor.: Suction gas pressure sensor fault.
        Storing hogedrukbeveiliging.: High pressure protection fault.
        Storing ventilatormotor DC.: DC fan motor fault.
        Communicatiestoring tussen printplaten en/of bedieningspaneel.: Communication fault between circuit boards and/or control panel.
        Er is een communicatiestoring tussen beide printplaten in de warmtepomp.: There is a communication fault between the two circuit boards in the heat pump.
        De voedingsspanning is niet in orde.: The supply voltage is not OK.
        Er is een overbelasting van de voedingsspanning.: The supply voltage is overloaded.
        Er is een probleem met de inverter PCB.: There is a problem with the inverter PCB.
        De voedingsspanning in de VDC-module (24 Volt-omvormer) is te hoog of te laag.: The supply voltage in the VDC module (24 volt converter) is too high or too low.
        Storing EEPROM warmtepomp.: Heat pump EEPROM fault.
        ? De pomp startte niet binnen de verwachte tijd. Controleer pompaansturing, relais, bedrijfstoestand en de flow (flow switch), omdat deze timeout op flow-detectie wordt bepaald.
        : The pump did not start within the expected time. Check pump control, relays, operating state and the flow (flow switch), because this timeout is based on flow detection.
        De compressor startte niet binnen de verwachte tijd. Controleer permissies, beveiligingen en startcondities.: The compressor did not start within the expected time. Check permissions, protections and start conditions.
        ? De pomp stopte niet binnen de verwachte tijd. Controleer relaisstatus, besturingslogica en de flow (flow switch), omdat deze timeout op flow-detectie wordt bepaald.
        : The pump did not stop within the expected time. Check relay status, control logic and the flow (flow switch), because this timeout is based on flow detection.
        ? De 3-weg klep bevindt zich niet in de verwachte stand (relaisterugmelding ontbreekt of temperatuurafwijking overschreden). Controleer klepaansturing, bedrading en klepmotor.
        : The 3-way valve is not in the expected position (relay feedback missing or temperature deviation exceeded). Check valve control, wiring and valve motor.
        ? De Modbus-communicatie met de binnen- of buitenunit kon niet worden hersteld binnen de verwachte tijd. Controleer bekabeling, voeding en Modbus-instellingen.
        : Modbus communication with the indoor or outdoor unit could not be restored within the expected time. Check cabling, power and Modbus settings.
        ? De binnenunit bevindt zich in failsafe of is herstart. Een of meer uitgangsregisters (1099-1113) wijken af van de verwachte status. De regeling is gestopt.
        : The indoor unit is in failsafe or has restarted. One or more output registers (1099-1113) differ from the expected state. Control has stopped.
        ? De buitenunit stopte de compressor zelf terwijl OpenAmber hem liet draaien. De regeling is gestopt. Controleer beveiligingen, voeding en de Modbus-verbinding met de buitenunit en reset daarna de fout.
        : The outdoor unit stopped the compressor itself while OpenAmber was running it. Control has stopped. Check protections, power and the Modbus connection to the outdoor unit, then reset the error.
        Storing sensor ruimtetemperatuur.: Room temperature sensor fault.
        De gekozen BLE-ruimtesensor heeft 10 minuten geen meting gestuurd. Controleer de batterij en het bereik van de sensor.: The selected BLE room sensor has not sent a reading for 10 minutes. Check the battery and the range of the sensor.
        Storing sensor tapwatertemperatuur.: Hot water temperature sensor fault.
