        De eerste keer wordt de normale werking van de warmtepomp na 5 minuten automatisch hervat.: Beim ersten Mal setzt die Wärmepumpe den Normalbetrieb nach 5 Minuten automatisch fort.
        ? De eerste keer wordt de normale werking van de warmtepomp na 5 minuten automatisch hervat. Als dezelfde storing binnen een bepaalde tijd drie keer optreedt, wordt de warmtepomp geblokkeerd en moet worden herstart.
        : Beim ersten Mal setzt die Wärmepumpe den Normalbetrieb nach 5 Minuten automatisch fort. Tritt dieselbe Störung innerhalb einer bestimmten Zeit dreimal auf, wird die Wärmepumpe gesperrt und muss neu gestartet werden.
        De warmtepomp is geblokkeerd door een storing in de compressorstart.: Die Wärmepumpe ist durch eine Störung beim Kompressorstart gesperrt.
        Als de persdruk meer dan 32 bar bedraagt wordt de compressor uitgeschakeld.: Liegt der Hochdruck über 32 bar, wird der Kompressor abgeschaltet.
        De compressorfrequentie zal worden begrensd. De druk zal hierdoor zakken en een normale werking wordt voortgezet.: Die Kompressorfrequenz wird begrenzt. Dadurch sinkt der Druck und der Normalbetrieb wird fortgesetzt.
        ? De compressor wordt voorverwarmd om te kunnen starten. Het zal maximaal 30 minuten duren voordat de compressor op bedrijfstemperatuur is. Daarna zal deze storing vanzelf verdwijnen en zal de compressor starten.
        : Der Kompressor wird zum Starten vorgeheizt. Es dauert höchstens 30 Minuten, bis er Betriebstemperatur hat. Danach verschwindet diese Meldung von selbst und der Kompressor startet.
