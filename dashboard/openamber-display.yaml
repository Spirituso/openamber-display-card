- title: Systeem
  path: systeem
  icon: mdi:chip
  type: panel
  background: '#0A2747'
  cards:
  - type: custom:button-card
    template: oa_screen
    variables:
      tab: systeem
    custom_fields:
      body: |-
        [[[
        return variables.oa.TR((() => {

        const {S, pos, T, DARK, panel, st, has, MI, header, maintOn, mainState} = variables.oa;
        const UP = 'update.openamber_firmware_update';
        const BSTOP = 'button.zentrale_openamber_gecontroleerd_stoppen', BRES = 'button.zentrale_openamber_hervatten_na_gecontroleerd_stoppen', BRST = 'button.zentrale_openamber_restart_openamber';
        const u = states[UP]; const ua = u ? u.attributes : {};
        const avail = u && u.state === 'on';
        const cur = ua.installed_version || '-', lat = ua.latest_version || '-';
        const rel = ua.release_url || 'https://github.com/Jordi1990/openamber/releases';
        const tms = (e) => { const v = Date.parse(st(e) || ''); return isNaN(v) ? 0 : v; };
        const tStop = tms(BSTOP), tRes = tms(BRES);
        const stopActive = tStop > tRes && Date.now() - tStop < 30 * 60 * 1000;
        const standby = mainState === 'Standby';
        const resumeBlocked = stopActive && (maintOn || !standby);
        const CS = (svc, ent) => `document.querySelector('home-assistant').hass.callService('${svc.split('.')[0]}','${svc.split('.')[1]}',{entity_id:'${ent}'});`;
        const SHOW = (id) => `event.stopPropagation();this.getRootNode().getElementById('${id}').style.display='flex'`;
        const HIDE = `event.stopPropagation();this.closest('.oa-modal').style.display='none'`;
        const mbtn = (label, act, blue, w) => `<div onclick="${HIDE};${act}" style="width:${S(w)};height:${S(56)};border-radius:${S(14)};background:${blue ? '#0072CE' : '#E5E7EB'};color:${blue ? '#fff' : DARK};font-size:${S(22)};display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto">${label}</div>`;
        const modal = (id, title, text, buttons, w = 560, h = 260) => `<div id="${id}" class="oa-modal" onclick="${HIDE}" style="${pos(0, 0, 1024, 600)}display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.5);z-index:10;pointer-events:auto">
        <div onclick="event.stopPropagation()" style="width:${S(w)};min-height:${S(h)};box-sizing:border-box;background:#fff;border-radius:${S(18)};padding:${S(24)};display:flex;flex-direction:column;gap:${S(16)};text-align:center;white-space:normal">
        <div style="font-size:${S(26)};color:${DARK};font-weight:500">${title}</div><div style="font-size:${S(22)};color:${DARK};line-height:1.3;flex:1">${text}</div>
        <div style="display:flex;justify-content:center;gap:${S(16)}">${buttons}</div></div></div>`;
        const cancel = (w) => mbtn('Annuleren', '', false, w || 200);
        const modals =
          modal('m-restart', 'Herstarten bevestigen', 'Wil je OpenAmber nu herstarten?', cancel() + mbtn('Herstarten', CS('button.press', BRST), true, 200)) +
          modal('m-stop', 'Warmtepomp stoppen', 'De warmtepomp wordt gecontroleerd uit bedrijf genomen. De regeling hervat automatisch na 30 minuten.', cancel() + mbtn('Stoppen', CS('button.press', BSTOP), true, 200)) +
          modal('m-upd', 'Update bevestigen', 'Wil je de firmware update nu starten?', cancel() + mbtn('Update starten', CS('update.install', UP), true, 200)) +
          modal('m-upd2', 'Warmtepomp in bedrijf', 'De update kan veilig tijdens bedrijf. Of stop eerst gecontroleerd en start de update opnieuw zodra de status Standby is.', cancel(150) + mbtn('Eerst stoppen', CS('button.press', BSTOP), false, 190) + mbtn('Nu updaten', CS('update.install', UP), true, 190), 620, 330);
        const vtxt = avail ? `Nieuwe versie ${lat} beschikbaar<br>Huidige versie: ${cur}` : `Geen nieuwe software beschikbaar<br>Huidige versie: ${cur}`;
        const ch = avail ? 146 : 76;
        const card = `<div style="${pos(42, 94, 940, ch)}box-sizing:border-box;background:#fff;border:${S(1)} solid #D5DEE9;border-radius:${S(14)};text-align:left;white-space:normal">
        <div style="${pos(18, 9, 580)}font-size:${S(24)};color:${DARK};line-height:1.25">${vtxt}</div>
        ${avail ? `<div onclick="${SHOW(standby ? 'm-upd' : 'm-upd2')}" style="${pos(18, 80, 250, 52)}border-radius:${S(26)};background:#0072CE;color:#fff;font-size:${S(22)};display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto">Update installeren</div>` : ''}
        <div onclick="event.stopPropagation();window.open('${rel}','_blank')" style="${pos(740, 9, 180, 40)}border-radius:${S(8)};border:${S(1)} solid #D5DEE9;font-size:${S(20)};color:#185FA5;display:flex;align-items:center;justify-content:center;gap:${S(6)};cursor:pointer;pointer-events:auto"><ha-icon icon="mdi:open-in-new" style="--mdc-icon-size:${S(20)};display:flex;pointer-events:none"></ha-icon>Release-info</div>
        </div>`;
        const tile = (i, icon, label, click, disabled) => `<div ${click && !disabled ? `onclick="${click}"` : ''} style="${pos(42 + i * 239.7, 94 + ch + 12, 220.9, 128)}box-sizing:border-box;background:${disabled ? '#EDF1F6' : '#fff'};border:${S(1)} solid #D5DEE9;border-radius:${S(14)};cursor:${disabled ? 'default' : 'pointer'};pointer-events:auto">
        <div style="${pos(84.5, 20, 52, 52)}border-radius:50%;background:#E6F1FB;display:flex;align-items:center;justify-content:center;opacity:${disabled ? 0.45 : 1}"><ha-icon icon="${icon}" style="--mdc-icon-size:${S(24)};color:#185FA5;display:flex"></ha-icon></div>
        <div style="position:absolute;left:2%;width:96%;bottom:${S(16)};text-align:center;white-space:normal;font-size:${S(20)};color:${disabled ? '#9CA3AF' : DARK};line-height:1.15">${label}</div></div>`;
        const NAVP = (p) => `event.stopPropagation();history.pushState(null,'','${p}');window.dispatchEvent(new CustomEvent('location-changed',{detail:{replace:false}}))`;
        const tiles =
          tile(0, 'mdi:update', 'Controleer updates', `event.stopPropagation();document.querySelector('home-assistant').hass.callService('homeassistant','update_entity',{entity_id:'${UP}'})`, false) +
          tile(1, 'mdi:power-standby', stopActive ? 'Hervat warmtepomp' : 'Stop warmtepomp', stopActive ? `event.stopPropagation();${CS('button.press', BRES)}` : SHOW('m-stop'), resumeBlocked) +
          tile(2, 'mdi:restart', 'Herstarten', SHOW('m-restart'), false) +
          tile(3, 'mdi:stethoscope', 'Diagnostiek', NAVP('/openamber-display/systeem-diagnostiek'), false);
        const ty = 94 + ch + 12 + 128 + 14;
        const LG = 'input_select.openamber_display_taal';
        const curL = st(LG) || 'Nederlands';
        const lbtn = (opt, x) => { const a = curL === opt; return `<div onclick="event.stopPropagation();document.querySelector('home-assistant').hass.callService('input_select','select_option',{entity_id:'${LG}',option:'${opt}'})" style="${pos(x, 10, 170, 44)}border-radius:${S(22)};background:${a ? '#0072CE' : '#E5E7EB'};color:${a ? '#fff' : DARK};font-size:${S(20)};display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto">${opt}</div>`; };
        const langRow = has(LG) ? `<div style="${pos(42, ty, 940, 64)}box-sizing:border-box;background:#fff;border:${S(1)} solid #D5DEE9;border-radius:${S(14)}">
        <ha-icon icon="mdi:translate" style="${pos(18, 18, 28, 28)}--mdc-icon-size:${S(28)};color:#185FA5;display:flex"></ha-icon>
        <div style="${pos(60, 19, 400)}font-size:${S(22)};color:${DARK};text-align:left">Taal / Language / Sprache</div>
        ${lbtn('Nederlands', 398)}${lbtn('English', 582)}${lbtn('Deutsch', 766)}</div>` : '';
        return panel + card + tiles + langRow + modals;


        })());
        ]]]
- title: Systeem – Diagnostiek
  path: systeem-diagnostiek
  icon: mdi:chip
  type: panel
  background: '#0A2747'
  cards:
  - type: custom:button-card
    template: oa_screen
    variables:
      tab: systeem
    custom_fields:
      body: |-
        [[[
        return variables.oa.TR((() => {

        const {S, pos, T, DARK, panel, st, has, MI, header} = variables.oa;
        const kb = (e) => { const v = parseFloat(st(e)); return isNaN(v) ? '-' : Math.round(v / 1024) + ' kB'; };
        const pc = (e) => { const v = parseFloat(st(e)); return isNaN(v) ? '-' : Math.round(v) + ' %'; };
        const upt = (() => { const v = parseFloat(st('sensor.openamber_uptime')); if (isNaN(v)) return '-'; const m = Math.floor(v / 60); return m >= 1440 ? `${Math.floor(m / 1440)} d ${Math.floor(m / 60) % 24} u` : (m >= 60 ? `${Math.floor(m / 60)} u ${m % 60} m` : `${m} m`); })();
        const u = states['update.openamber_firmware_update'];
        const tbl = (title, rows) => `<div style="background:#fff;border:${S(1)} solid #D5DEE9;border-radius:${S(14)};padding:${S(9)} ${S(18)} ${S(12)}"><div style="font-size:${S(20)};color:#6B7280;margin-bottom:${S(6)}">${title}</div>` +
          rows.map((r) => `<div ${r[2] ? `onclick="event.stopPropagation();${MI(r[2])}"` : ''} style="display:flex;font-size:${S(22)};color:${DARK};padding:${S(4)} 0;${r[2] ? 'cursor:pointer;pointer-events:auto' : ''}"><div style="width:44%">${r[0]}</div><div style="width:56%">${r[1]}</div></div>`).join('') + `</div>`;
        const left = tbl('Geheugen', [['Heap vrij', kb('sensor.zentrale_openamber_heap_free'), 'sensor.zentrale_openamber_heap_free'], ['Heap frag.', pc('sensor.zentrale_openamber_heap_fragmentation'), 'sensor.zentrale_openamber_heap_fragmentation'], ['Heap max', kb('sensor.zentrale_openamber_heap_max_block'), 'sensor.zentrale_openamber_heap_max_block'], ['PSRAM vrij', kb('sensor.zentrale_openamber_free_psram'), 'sensor.zentrale_openamber_free_psram']]);
        const right = tbl('Runtime', [['OpenAmber', u && u.attributes.installed_version ? u.attributes.installed_version : '-', null], ['Uptime', upt, 'sensor.openamber_uptime']]) +
          tbl('ESP', [['Chip', '-', null], ['Reset reason', '-', null]]);
        const body = `<div style="${pos(42, 152, 940, 360)}display:flex;gap:${S(18.8)};align-items:flex-start;text-align:left;white-space:normal"><div style="width:49%">${left}</div><div style="width:49%;display:flex;flex-direction:column;gap:${S(10)}">${right}</div></div>`;
        const hdr = header('Diagnostiek', '/openamber-display/systeem', 'Systeem').replace(`${pos(40, 76, 944, 60)}`, `${pos(42, 94, 940, 48)}`);
        return panel + hdr + body;


        })());
        ]]]
  subview: true
