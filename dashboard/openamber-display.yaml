      - border-radius: 0px
      - box-shadow: none
      - background: '#0C2C52'
      - overflow: hidden
      - display: block
      - max-width: calc((100vh - 64px) * 1024 / 600)
      - margin: 0 auto
      - font-family: Roboto, 'Segoe UI', Arial, sans-serif
      - text-align: left
      - height: auto
      grid:
      - display: block
      - position: relative
      - width: 100%
      - container-type: inline-size
      - --s: calc(100cqw / 1024)
      - height: auto
      custom_fields:
        body:
        - display: block
        - position: relative
        - width: 100%
        - aspect-ratio: 1024 / 600
        - pointer-events: none
        - z-index: '1'
        header:
        - position: absolute
        - top: '0'
        - left: '0'
        - width: 100%
        - height: 100%
        - pointer-events: none
        - z-index: '2'
        nav:
        - position: absolute
        - top: '0'
        - left: '0'
        - width: 100%
        - height: 100%
        - pointer-events: none
        - z-index: '2'
    custom_fields:
      header: |-
        [[[
        return variables.oa.TR((() => {

        const num = (e, d = 1) => { const s = states[e]; const v = s ? parseFloat(s.state) : NaN; return isNaN(v) ? '-' : v.toFixed(d); };
        const val = (e) => { const s = states[e]; const v = s ? parseFloat(s.state) : NaN; return isNaN(v) ? NaN : v; };
        const on = (e) => !!states[e] && states[e].state === 'on';
        const S = (n) => `calc(${n} * var(--s))`;
        const IMG = 'https://raw.githubusercontent.com/Jordi1990/openamber/c8ac5de2cf02d833947d59d5839ab23f51b9d7ae/src/openamber/ui/images/';
        const pos = (x, y, w, h) => `position:absolute;left:${S(x)};top:${S(y)};` + (w !== undefined ? `width:${S(w)};` : '') + (h !== undefined ? `height:${S(h)};` : '');
        const T = (x, y, size, color, weight, content, extra = '') => `<div style="${pos(x, y)}font-size:${S(size)};color:${color};font-weight:${weight};line-height:1.15;white-space:nowrap;${extra}">${content}</div>`;
        const TC = (y, w, size, color, weight, content, extra = '') => `<div style="${pos(0, y, w)}text-align:center;font-size:${S(size)};color:${color};font-weight:${weight};line-height:1.15;${extra}">${content}</div>`;
        const I = (x, y, size, color, name, extra = '') => `<ha-icon icon="${name}" style="${pos(x, y, size, size)}--mdc-icon-size:${S(size)};color:${color};display:flex;${extra}"></ha-icon>`;
        const MI = (e) => `this.dispatchEvent(new CustomEvent('hass-more-info',{bubbles:true,composed:true,detail:{entityId:'${e}'}}))`;
        const NAV = (p) => `history.pushState(null,'','${p}');window.dispatchEvent(new CustomEvent('location-changed',{detail:{replace:false}}))`;
        const DARK = '#1F2933', LINE = '#D7E0EA', CARD = '#F5F8FC';
        const shadow = `box-shadow:0 ${S(4)} ${S(10)} rgba(0,0,0,0.28);`;
        const fw = states['update.openamber_firmware_update'];
        const ver = fw && fw.attributes.installed_version ? ` (${fw.attributes.installed_version})` : '';
        const online = on('binary_sensor.openamber_modbus_binnenunit') && on('binary_sensor.openamber_modbus_buitenunit');
        const modelState = states['sensor.zentrale_openamber_warmtepomp_model'];
        const model = online ? (modelState && !['unknown', 'unavailable'].includes(modelState.state) ? modelState.state : 'Amber') : 'Verbinden...';
        const rssi = val('sensor.openamber_wifi_signal_db');
        const wifiIcon = isNaN(rssi) ? 'mdi:wifi-strength-off-outline' : rssi >= -60 ? 'mdi:wifi-strength-4' : rssi >= -70 ? 'mdi:wifi-strength-3' : rssi >= -80 ? 'mdi:wifi-strength-2' : 'mdi:wifi-strength-1';
        const wifiColor = isNaN(rssi) ? '#9CA3AF' : rssi >= -70 ? '#D1D5DB' : rssi >= -80 ? '#F59E0B' : '#EF4444';
        let status = '';
        if (on('binary_sensor.openamber_warmtevraag')) status += `<ha-icon icon="mdi:fire" style="--mdc-icon-size:${S(30)};color:#F97316;display:flex"></ha-icon>`;
        if (on('binary_sensor.openamber_koudevraag')) status += `<ha-icon icon="mdi:snowflake" style="--mdc-icon-size:${S(30)};color:#38BDF8;display:flex"></ha-icon>`;
        if (on('binary_sensor.openamber_tapwater_vraag')) status += `<ha-icon icon="mdi:water-pump" style="--mdc-icon-size:${S(30)};color:#22D3EE;display:flex"></ha-icon>`;
        if (on('binary_sensor.zentrale_openamber_waarschuwing_actief')) status += `<div style="background:#F59E0B;border-radius:${S(16)};padding:${S(2)} ${S(8)};display:flex"><ha-icon icon="mdi:alert" style="--mdc-icon-size:${S(26)};color:#fff;display:flex"></ha-icon></div>`;
        if (on('binary_sensor.zentrale_openamber_error_actief')) status += `<div style="background:#EF4444;border-radius:${S(16)};padding:${S(2)} ${S(8)};display:flex"><ha-icon icon="mdi:alert" style="--mdc-icon-size:${S(26)};color:#fff;display:flex"></ha-icon></div>`;
        const header = `
        <div style="${pos(0, 0, 1024, 72)}background:#15457A;">
        <img src="${IMG}icon.png" style="${pos(22, 1, 57, 70)}object-fit:contain">
        ${T(86, 14, 31, '#fff', 700, 'OpenAmber' + ver)}
        <div style="position:absolute;left:50%;transform:translateX(-50%);top:${S(36)};height:${S(32)};padding:0 ${S(10)};border-radius:${S(8)};background:${online ? '#0072CE' : '#475569'};display:flex;align-items:center;gap:${S(8)};color:#fff;font-size:${S(20)};font-weight:700;white-space:nowrap">
        <ha-icon icon="mdi:heat-pump-outline" style="--mdc-icon-size:${S(20)};display:flex"></ha-icon>${model}
        </div>
        <div style="position:absolute;right:${S(110)};top:${S(18)};height:${S(36)};display:flex;align-items:center;gap:${S(10)}">${status}</div>
        ${I(920, 18, 36, '#D1D5DB', 'mdi:home-assistant')}
        ${I(964, 18, 36, wifiColor, wifiIcon)}
        </div>`;
        return header;

        })());
        ]]]
