        const IMG = 'https://raw.githubusercontent.com/Jordi1990/openamber/c8ac5de2cf02d833947d59d5839ab23f51b9d7ae/src/openamber/ui/images/';
        const pos = (x, y, w, h) => `position:absolute;left:${S(x)};top:${S(y)};` + (w !== undefined ? `width:${S(w)};` : '') + (h !== undefined ? `height:${S(h)};` : '');
        const T = (x, y, size, color, weight, content, extra = '') => `<div style="${pos(x, y)}font-size:${S(size)};color:${color};font-weight:${weight};line-height:1.15;white-space:nowrap;${extra}">${content}</div>`;
        const TC = (y, w, size, color, weight, content, extra = '') => `<div style="${pos(0, y, w)}text-align:center;font-size:${S(size)};color:${color};font-weight:${weight};line-height:1.15;${extra}">${content}</div>`;
        const I = (x, y, size, color, name, extra = '') => `<ha-icon icon="${name}" style="${pos(x, y, size, size)}--mdc-icon-size:${S(size)};color:${color};display:flex;${extra}"></ha-icon>`;
        const MI = (e) => `this.dispatchEvent(new CustomEvent('hass-more-info',{bubbles:true,composed:true,detail:{entityId:'${e}'}}))`;
        const NAV = (p) => `history.pushState(null,'','${p}');window.dispatchEvent(new CustomEvent('location-changed',{detail:{replace:false}}))`;
        const DARK = '#1F2933', LINE = '#D7E0EA', CARD = '#F5F8FC';
        const shadow = `box-shadow:0 ${S(4)} ${S(10)} rgba(0,0,0,0.28);`;
        const coolDemand = on('binary_sensor.openamber_koudevraag');
        const loop = states['sensor.openamber_control_loop_state_heat_cool'];
        const heating = on('binary_sensor.openamber_warmtevraag') || val('sensor.openamber_compressor_frequentie') > 0 || (loop && !['Idle', 'unknown', 'unavailable'].includes(loop.state));
        const mode = coolDemand ? ['Koelen', 'mdi:snowflake', '#0072CE'] : heating ? ['Verwarmen', 'mdi:fire', '#F97316'] : ['Standby', 'mdi:power-sleep', '#B0B3B8'];
        const ring = (x, y, d, color, iconName, iconSize) => `<div style="${pos(x, y, d, d)}box-sizing:border-box;border:${S(2)} solid ${color};border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center"><ha-icon icon="${iconName}" style="--mdc-icon-size:${S(iconSize)};color:${color};display:flex"></ha-icon></div>`;
        const water = `
        <div style="${pos(28, 84, 474, 428)}background:${CARD};border-radius:${S(18)};overflow:hidden;${shadow}">
        ${I(26, 26, 24, '#0072CE', 'mdi:water')}
        ${T(60, 24, 23, DARK, 700, 'Watercircuit')}
        <div onclick="${MI('sensor.openamber_control_loop_state_heat_cool')}" style="position:absolute;right:${S(28)};top:${S(20)};height:${S(37)};padding:0 ${S(14)};border-radius:${S(16)};background:${mode[2]};display:flex;align-items:center;gap:${S(8)};color:#fff;font-size:${S(22)};font-weight:500;cursor:pointer;pointer-events:auto">
        <ha-icon icon="${mode[1]}" style="--mdc-icon-size:${S(22)};display:flex"></ha-icon>${mode[0]}
        </div>
        <img src="${IMG}water_circuit.png" style="${pos(63, 72, 350, 188)}">
        <div onclick="${MI('sensor.openamber_cv_aanvoertemperatuur_tuo')}" style="${pos(32, 125, 148, 75)}box-sizing:border-box;background:#fff;border:${S(1)} solid ${LINE};border-radius:${S(12)};cursor:pointer;pointer-events:auto">
        ${ring(8, 17, 40, '#E84A2A', 'mdi:thermometer', 24)}
        ${T(58, 9, 19, DARK, 700, 'Aanvoer')}
        ${T(58, 37, 22, '#E84A2A', 500, num('sensor.openamber_cv_aanvoertemperatuur_tuo') + '°C')}
        </div>
        <div onclick="${MI('sensor.openamber_cv_retourtemperatuur_tui')}" style="${pos(302, 125, 140, 75)}box-sizing:border-box;background:#fff;border:${S(1)} solid ${LINE};border-radius:${S(12)};cursor:pointer;pointer-events:auto">
        ${T(10, 9, 19, DARK, 700, 'Retour')}
        ${T(10, 37, 22, '#1B61B8', 500, num('sensor.openamber_cv_retourtemperatuur_tui') + '°C')}
        ${ring(90, 17, 40, '#1B61B8', 'mdi:thermometer', 24)}
        </div>
        ${T(205, 207, 21, DARK, 500, '△ T')}
        ${T(194, 236, 22, DARK, 500, num('sensor.openamber_t_warmtewisselaar') + '°C')}
        <div style="${pos(0, 309, 474, 119)}background:#fff;border-top:${S(1)} solid ${LINE};">
        <div style="${pos(0, 85, 474, 1)}background:${LINE}"></div>
        <div onclick="${MI('sensor.zentrale_openamber_regeltemperatuur')}" style="${pos(0, 0, 164, 85)}cursor:pointer;pointer-events:auto">
        ${ring(6, 26, 34, '#5C4CC2', 'mdi:thermometer', 20)}
        ${T(50, 13, 18, DARK, 700, 'Afgifte (Tc)')}
        ${T(50, 40, 21, '#5C4CC2', 500, num('sensor.zentrale_openamber_regeltemperatuur') + '°C')}
        </div>
        <div style="${pos(165, 16, 1, 54)}background:${LINE}"></div>
        <div onclick="${MI('sensor.openamber_huidig_setpoint')}" style="${pos(166, 0, 163, 85)}cursor:pointer;pointer-events:auto">
        ${ring(8, 26, 34, '#5C4CC2', 'mdi:cog', 20)}
        ${T(52, 13, 18, DARK, 700, 'Doel')}
        ${T(52, 40, 21, '#5C4CC2', 500, num('sensor.openamber_huidig_setpoint') + '°C')}
        </div>
        <div style="${pos(330, 16, 1, 54)}background:${LINE}"></div>
        <div onclick="${MI('sensor.openamber_buitentemperatuur_ta')}" style="${pos(331, 0, 143, 85)}cursor:pointer;pointer-events:auto">
        ${ring(6, 26, 34, '#0072CE', 'mdi:thermometer', 20)}
        ${T(50, 13, 18, DARK, 700, 'Buiten')}
        ${T(50, 40, 21, '#0072CE', 500, num('sensor.openamber_buitentemperatuur_ta') + '°C')}
        </div>
        </div>
        </div>`;
        const dhwPump = on('binary_sensor.openamber_tapwater_pomp');
        const tank = `
        <div onclick="${MI('sensor.openamber_tapwatertemperatuur_tw')}" style="${pos(518, 84, 160, 428)}background:${CARD};border-radius:${S(18)};overflow:hidden;cursor:pointer;pointer-events:auto;${shadow}">
        ${TC(20, 160, 23, DARK, 700, 'Tapwater')}
        <img src="${IMG}dhw_tank.png" style="${pos(15, 104, 130, 217)}">
        ${TC(176, 160, 31, DARK, 700, num('sensor.openamber_tapwatertemperatuur_tw') + '°C')}
        ${TC(219, 160, 22, '#475569', 500, 'Doel')}
        ${TC(243, 160, 22, DARK, 500, num('sensor.openamber_huidig_tapwater_setpoint') + '°C')}
        ${dhwPump ? I(124, 194, 30, '#22D3EE', 'mdi:loading', `animation:oa-spin 1.2s linear infinite;`) : ''}
        ${I(68, 333, 24, '#0072CE', 'mdi:water-pump')}
        ${TC(362, 160, 21, DARK, 500, 'Pomp')}
        ${TC(388, 160, 21, DARK, 500, dhwPump ? 'AAN' : 'UIT')}
        </div>`;
        const rpm = val('sensor.openamber_fan_rpm');
        const pwm = val('sensor.openamber_pomp_p0_pwm');
        const hz = val('sensor.openamber_compressor_frequentie');
        const defrost = on('binary_sensor.zentrale_openamber_ontdooien_actief') || on('binary_sensor.openamber_defrost');
        const tiles = [
        ['Fan', 'mdi:fan', rpm > 0, isNaN(rpm) ? '- RPM' : `${rpm.toFixed(0)} RPM`, 'sensor.openamber_fan_rpm'],
        ['Pomp', 'mdi:water-pump', pwm > 0, pwm > 0 ? `${pwm.toFixed(0)}%` : 'UIT', 'sensor.openamber_pomp_p0_pwm'],
        ['Defrost', 'mdi:snowflake-melt', defrost, defrost ? 'AAN' : 'UIT', 'binary_sensor.openamber_defrost'],
        ['Compressor', 'mdi:heat-pump-outline', hz > 0, isNaN(hz) ? '- Hz' : `${hz.toFixed(0)} Hz`, 'sensor.openamber_compressor_frequentie'],
        ['Backup heater', 'mdi:fire', on('binary_sensor.openamber_verwarmingselement'), on('binary_sensor.openamber_verwarmingselement') ? 'AAN' : 'UIT', 'binary_sensor.openamber_verwarmingselement'],
        ['Bodemplaat<br>verwarming', 'mdi:radiator', on('binary_sensor.openamber_bodemplaat_verwarming'), on('binary_sensor.openamber_bodemplaat_verwarming') ? 'AAN' : 'UIT', 'binary_sensor.openamber_bodemplaat_verwarming'],
        ];
        const tx = [697, 854], ty = [84, 231, 379];
        const tileHtml = tiles.map((t, i) => `
        <div onclick="${MI(t[4])}" style="${pos(tx[i % 2], ty[Math.floor(i / 2)], 142, 132)}background:${t[2] ? CARD : '#919191'};border-radius:${S(16)};cursor:pointer;pointer-events:auto;${shadow}">
        ${I(59, 17, 24, '#0072CE', t[1])}
        <div style="${pos(0, 36, 142, 56)}display:flex;align-items:center;justify-content:center;text-align:center;font-size:${S(20)};font-weight:700;color:${DARK};line-height:1.15">${t[0]}</div>
        ${TC(103, 142, 13, DARK, 500, t[3])}
        </div>`).join('');
        return `<style>@keyframes oa-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }</style>${water}${tank}${tileHtml}`;

        })());
        ]]]
