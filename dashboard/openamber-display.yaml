        : Die Pumpe ist nicht in der erwarteten Zeit angelaufen. Prüfe Pumpenansteuerung, Relais, Betriebszustand und den Durchfluss (Strömungsschalter), denn diese Zeitüberschreitung beruht auf der Durchflusserkennung.
        De compressor startte niet binnen de verwachte tijd. Controleer permissies, beveiligingen en startcondities.: Der Kompressor ist nicht in der erwarteten Zeit angelaufen. Prüfe Freigaben, Schutzeinrichtungen und Startbedingungen.
        ? De pomp stopte niet binnen de verwachte tijd. Controleer relaisstatus, besturingslogica en de flow (flow switch), omdat deze timeout op flow-detectie wordt bepaald.
        : Die Pumpe hat nicht in der erwarteten Zeit gestoppt. Prüfe Relaisstatus, Steuerlogik und den Durchfluss (Strömungsschalter), denn diese Zeitüberschreitung beruht auf der Durchflusserkennung.
        ? De 3-weg klep bevindt zich niet in de verwachte stand (relaisterugmelding ontbreekt of temperatuurafwijking overschreden). Controleer klepaansturing, bedrading en klepmotor.
        : Das 3-Wege-Ventil steht nicht in der erwarteten Stellung (Relaisrückmeldung fehlt oder Temperaturabweichung überschritten). Prüfe Ventilansteuerung, Verdrahtung und Ventilmotor.
        ? De Modbus-communicatie met de binnen- of buitenunit kon niet worden hersteld binnen de verwachte tijd. Controleer bekabeling, voeding en Modbus-instellingen.
        : Die Modbus-Kommunikation mit der Innen- oder Außeneinheit ließ sich nicht in der erwarteten Zeit wiederherstellen. Prüfe Verkabelung, Stromversorgung und Modbus-Einstellungen.
        ? De binnenunit bevindt zich in failsafe of is herstart. Een of meer uitgangsregisters (1099-1113) wijken af van de verwachte status. De regeling is gestopt.
        : Die Inneneinheit ist im Failsafe oder wurde neu gestartet. Ein oder mehrere Ausgangsregister (1099-1113) weichen vom erwarteten Zustand ab. Die Regelung ist gestoppt.
        ? De buitenunit stopte de compressor zelf terwijl OpenAmber hem liet draaien. De regeling is gestopt. Controleer beveiligingen, voeding en de Modbus-verbinding met de buitenunit en reset daarna de fout.
        : Die Außeneinheit hat den Kompressor selbst gestoppt, während OpenAmber ihn laufen ließ. Die Regelung ist gestoppt. Prüfe Schutzeinrichtungen, Stromversorgung und die Modbus-Verbindung zur Außeneinheit und setze danach den Fehler zurück.
